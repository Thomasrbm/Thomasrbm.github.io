<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mon Discord</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#23272A; font-family:Arial,sans-serif; }
    .card { background:#2C2F33; padding:30px; border-radius:16px; text-align:center; color:white; }
    h1 { margin:0 0 15px; font-size:22px; color:#AEB3C2; }
    .tag { font-size:26px; font-weight:bold; margin-bottom:20px; }
    button {
      border:0; border-radius:10px; padding:10px 18px;
      background:#5865F2; color:white; font-weight:600;
      cursor:pointer; box-shadow:0 6px 15px rgba(88,101,242,.4);
    }
    button:hover { filter:brightness(1.1); }
    #msg { margin-top:12px; font-size:13px; color:#AEB3C2; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mon Discord</h1>
    <div class="tag" id="tag">thomasrob.#0064</div>
    <button id="copy">📋 Copier</button>
    <div id="msg"></div>
  </div>

  <script>
    const tag = "thomasrob.#0064";
    const btn = document.getElementById("copy");
    const msg = document.getElementById("msg");
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(tag);
        msg.textContent = "Copié ✅";
      } catch {
        msg.textContent = "Impossible de copier, faites Ctrl+C";
      }
      setTimeout(() => msg.textContent = "", 2000);
    });
  </script>
</body>
</html>
